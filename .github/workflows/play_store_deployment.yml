name: Deploy to Google Play (Internal Track)

on:
  # Trigger when pushing a tag like 'v1.0.0'
  push:
    tags:
      - 'v*'
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          echo "$KEY_PROPERTIES" > android/key.properties

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload to Google Play (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.geomapcam.geotag
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft # Sets the release as draft so you can review before rollout
